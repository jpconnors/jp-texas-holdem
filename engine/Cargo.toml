[package]
name = "holdem-core"
version = "0.2.0"
edition = "2021"
description = "Engine, hand evaluator and AI opponents for JP's Texas Hold'em (compiled to WebAssembly)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
